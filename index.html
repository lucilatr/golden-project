<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GOLDEN — Production Hub</title>
  <script>
    /* antes de pintar, para que no parpadee el tema ni el menú */
    (function () {
      var root = document.documentElement, theme, side;
      try { theme = localStorage.getItem("golden_theme"); side = localStorage.getItem("golden_side"); } catch (e) {}
      if (theme === "light") root.dataset.theme = "light";
      if (side === "collapsed" || window.matchMedia("(max-width:700px)").matches) root.classList.add("side-collapsed");
    })();
  </script>
  <link rel="stylesheet" href="styles.css?v=47">
  <link rel="stylesheet" href="hub.css?v=25">
</head>
<body>
  <aside class="hub-side" id="hub-side">
    <div class="hub-side-head">
      <div class="hub-brand" id="hub-brand"></div>
      <button class="hub-side-toggle" id="hub-side-toggle" type="button" aria-controls="hub-side">«</button>
    </div>
    <nav class="hub-tabs" id="hub-tabs" aria-label="Secciones"></nav>
    <div class="hub-side-foot">
      <button class="hub-theme" id="hub-theme" type="button"></button>
      <div class="hub-status" id="hub-status"></div>
    </div>
  </aside>

  <div id="hub-views">
    <section class="hub-view pad active" id="view-resumen"></section>

    <section class="hub-view" id="view-script">
      <div class="app">
        <header id="header" class="header"></header>
        <main id="main"></main>
      </div>
    </section>

    <section class="hub-view" id="view-guion"></section>

    <section class="hub-view pad" id="view-tracker"></section>

    <section class="hub-view" id="view-cal"></section>

    <section class="hub-view pad" id="view-reuniones"></section>

    <section class="hub-view pad" id="view-feedback"></section>

    <section class="hub-view pad" id="view-direccion"></section>

    <section class="hub-view" id="view-guia">
      <iframe class="hub-frame" src="guia-para-testear.html" title="Guía de testeo"></iframe>
    </section>
  </div>

  <div id="overlay" class="overlay"></div>
  <aside id="drawer" class="drawer"></aside>

  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js?v=47"></script>
  <script src="tracker-media.js?v=2"></script>
  <script src="tracker.js?v=29"></script>
  <script src="guion.js?v=14"></script>
  <script src="reuniones.js?v=3"></script>
  <script src="feedback.js?v=3"></script>
  <script src="direccion.js?v=1"></script>
</body>
</html>
